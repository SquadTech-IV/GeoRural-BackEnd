spring.application.name=georural

# Arquivo .env
spring.config.import=optional:file:./.env[.properties]

# Conexao com o Oracle Autonomous Database (via wallet)
spring.datasource.url=jdbc:oracle:thin:@${TNS_NAME:georural_tp}?TNS_ADMIN=${WALLET_DIR:${user.dir}/wallet}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Upload de arquivos
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# Data lake - OCI Object Storage
georural.lake.region=sa-saopaulo-1
georural.lake.namespace=grcfu9trlodp
georural.lake.bucket.bruta=georural-bruta
georural.lake.bucket.quarentena=georural-quarentena
georural.lake.bucket.tratada=georural-tratada
georural.lake.bucket.publicada=georural-publicada
georural.lake.oci-config-file=${user.home}/.oci/config
georural.lake.oci-profile=GEORURAL_APP